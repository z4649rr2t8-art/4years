const apps=[['카카오톡','💬','#fee500','chat'],['인스타그램','📷','#f4d6e8','insta'],['사진','🌈','#fff','photos'],['전화','📞','#b8e6b2','phone'],['사파리','🧭','#d9efff','safari'],['유튜브','▶️','#ffd9d9','youtube'],['메시지','💬','#b8e6b2','disabled'],['날씨','☀️','#cce8ff','disabled'],['캘린더','📅','#fff','calendar'],['시계','🕒','#eee','clock']];

const seedChats={
jae:[
{from:'in',text:'자기야 머해',date:'2026년 11월 7일',time:'오전 10:10'},
{from:'out',text:'아까 일어났어',date:'2026년 11월 7일',time:'오전 10:12'},
{from:'in',text:'그랬구낭',date:'2026년 11월 7일',time:'오전 10:12'},

{from:'in',text:'자료는 단톡방 공지에 올려두었습니다. 확인 부탁드립니다!',date:'2026년 11월 7일',time:'오후 3:21'},
{from:'out',text:'확인했습니다!',date:'2026년 11월 7일',time:'오후 3:25'}
],

{from:'in',text:'아들 밥은 먹었어?',date:'2026년 11월 7일',time:'오후 6:10'},
{from:'out',text:'응 엄마 먹었어 ㅎㅎ',date:'2026년 11월 7일',time:'오후 6:14'},
{from:'in',text:'그래~ 요즘 날 추우니까 따뜻하게 입고 다녀',date:'2026년 11월 7일',time:'오후 6:15'}
]
};
const storageKey='4years-kakao-history-v4';
let chatRecords;
try{chatRecords=JSON.parse(localStorage.getItem(storageKey))||structuredClone(seedChats)}catch(e){chatRecords=JSON.parse(JSON.stringify(seedChats))}
function saveChats(){try{localStorage.setItem(storageKey,JSON.stringify(chatRecords))}catch(e){}}
const chatLabels={jae:'재현이🧡',dong:'동현',group:'경영학과 단톡방',mom:'엄마'};

let storyFlow=localStorage.getItem(flowKey)||'start';
function setFlow(v){storyFlow=v;try{localStorage.setItem(flowKey,v)}catch(e){}}
function notify(from,preview,target){
 const n=$('pushnote');n.innerHTML=`<div class="pushicon">💬</div><div class="pushcopy"><b>${chatLabels[from]}</b><span>${preview}</span></div><span class="pushtime">지금</span>`;
 n.classList.add('visible');n.onclick=()=>{n.classList.remove('visible');room(target)};
}
let key='jae';
const $=id=>document.getElementById(id);
function avatar(k,cls='avatar'){let p=people[k];return p.img?`<img class="${cls}" src="${p.img}">`:`<span class="${cls}" style="display:grid;place-items:center;background:#eee">🌷</span>`}

function goHome(){$('view').classList.remove('show');$('cc').classList.remove('show');$('home').classList.add('on')}
function chatList(){
 const order=['jae','dong','group','mom'];
 show('카카오톡',`<input class="search" placeholder="🔍 검색"><div>${order.map(k=>{let arr=chatRecords[k],last=arr[arr.length-1];return `<button class="listrow" data-chat="${k}">${avatar(k)}<span class="rowtext"><b>${chatLabels[k]}</b><div class="preview">${last?last.text:''}</div></span><span class="tinytime">${last?last.time:''}</span></button>`}).join('')}</div>`);
}
function room(k){key=k;
 if(k==='dong'&&storyFlow==='waiting-dong'&&!chatRecords.dong.some(m=>m.from==='in'&&m.text==='오늘 강의 끝나고 잠깐 카페가서 얘기할 수 있어요? 저 고민상담 해주세요오..')){
  chatRecords.dong.push({from:'in',text:'오늘 강의 끝나고 잠깐 카페가서 얘기할 수 있어요? 저 고민상담 해주세요오..',date:'2026년 11월 8일',time:'오전 10:02'});saveChats();
 }
 drawRoom()}
function drawRoom(){
 let p=people[key],records=chatRecords[key]||[];
 show('카카오톡',`<div class="kakao"><div class="roomtop"><button id="roomback">‹</button>${avatar(key,'')}<b>${chatLabels[key]||p.name}</b><button>☰</button></div><div class="msgs" id="msgs"></div><div class="replybox" id="reply"></div></div>`);
 $('roomback').onclick=chatList;
 let box=$('msgs'),lastDate='';
 records.forEach(m=>{
   if(m.date!==lastDate){let d=document.createElement('div');d.className='day';d.textContent=m.date;box.appendChild(d);lastDate=m.date}
   addMsg(m.from,m.text,m.time);
 });
 box.scrollTop=box.scrollHeight;
 let choice='';
 if(key==='jae' && storyFlow==='start' && records.some(m=>m.from==='in'&&m.text==='자기 일어났어?') && !records.some(m=>m.from==='out'&&m.text==='엉 일어낫어')) choice='엉 일어낫어';
 else if(key==='dong' && storyFlow==='waiting-dong'){
   if(!records.some(m=>m.from==='in'&&m.text==='오늘 강의 끝나고 잠깐 카페가서 얘기할 수 있어요? 저 고민상담 해주세요오..')) choice='';
   else if(!records.some(m=>m.from==='out'&&m.text==='알겠어 강의 끝나고 보자')) choice='알겠어 강의 끝나고 보자';
 } else if(key==='jae' && storyFlow==='waiting-jae' && records.some(m=>m.from==='in'&&m.text==='오늘 강의 끝나고 뭐해?') && !records.some(m=>m.from==='out'&&m.text==='아 약속 있어서 저녁에 내가 연락할겡!')) choice='아 약속 있어서 저녁에 내가 연락할겡!';
 $('reply').innerHTML=choice?`<button data-pick="0">${choice}</button>`:'';
}
function addMsg(from,text,stamp=null){
 let p=people[key],box=$('msgs'),line=document.createElement('div');
 line.className='line '+(from==='in'?'in':'out');
 line.innerHTML=`${from==='in'?avatar(key,'miniava'):''}<div class="msgbody">${from==='in'?`<div class="sender">${(chatLabels[key]||p.name).replace('🧡','')}</div>`:''}<div class="bubble"></div></div><span class="time">${stamp||''}</span>`;
 line.querySelector('.bubble').textContent=text;box.appendChild(line);box.scrollTop=box.scrollHeight;
}
function pick(i){
 if(i!==0)return;
 const date='2026년 11월 8일';
 let message;
 if(key==='jae' && chatRecords.jae.some(m=>m.from==='in'&&m.text==='자기 일어났어?') && !chatRecords.jae.some(m=>m.from==='out'&&m.text==='엉 일어낫어')){
   message={from:'out',text:'엉 일어낫어',date,time:'오전 9:43'};
   chatRecords.jae.push(message);saveChats();addMsg('out',message.text,message.time);$('reply').innerHTML='';
   setFlow('waiting-dong');setTimeout(()=>notify('dong','선배 오늘 강의 끝나고 잠깐 카페가서 얘기할 수 있어요? 저 고민상담 해주세요오..','dong'),650);
   return;
 } 
 if(key==='dong' && storyFlow==='waiting-dong' && !chatRecords.dong.some(m=>m.from==='in'&&m.text==='오늘 강의 끝나고 잠깐 카페가서 얘기할 수 있어요? 저 고민상담 해주세요오..')){
   const incoming={from:'in',text:'오늘 강의 끝나고 잠깐 카페가서 얘기할 수 있어요? 저 고민상담 해주세요오..',date,time:'오전 10:02'};
   chatRecords.dong.push(incoming);saveChats();addMsg('in',incoming.text,incoming.time);
   $('reply').innerHTML='<button data-pick="0">알겠어 강의 끝나고 보자</button>';
   return;
 }
 if(key==='dong' && storyFlow==='waiting-dong' && !chatRecords.dong.some(m=>m.from==='out'&&m.text==='알겠어 강의 끝나고 보자')){
   message={from:'out',text:'알겠어 강의 끝나고 보자',date,time:'오전 10:04'};
   chatRecords.dong.push(message);saveChats();addMsg('out',message.text,message.time);$('reply').innerHTML='';
   const incoming={from:'in',text:'오늘 강의 끝나고 뭐해?',date,time:'오전 10:06'};
   chatRecords.jae.push(incoming);saveChats();setFlow('waiting-jae');
   setTimeout(()=>notify('jae',incoming.text,'jae'),650);
   return;
 }
 if(key==='jae' && storyFlow==='waiting-jae' && !chatRecords.jae.some(m=>m.from==='out'&&m.text==='아 약속 있어서 저녁에 내가 연락할겡!')){
   message={from:'out',text:'아 약속 있어서 저녁에 내가 연락할겡!',date,time:'오전 10:07'};

 }
}
